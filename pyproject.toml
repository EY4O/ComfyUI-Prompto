[project]
name = "comfyui-prompto"
description = "ComfyUI side of the Prompto Chrome extension: Prompto Recipe, Character, Snippet and Wildcards nodes, a Prompto library sidebar, load recipes into the workflow, add snippets at the cursor, Save to Prompto on nodes and images, and auto-capture of saved images."
version = "0.7.1"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/EY4O/ComfyUI-Prompto"
"Bug Tracker" = "https://github.com/EY4O/ComfyUI-Prompto/issues"
#  Used by Comfy Registry https://registry.comfy.org

[tool.comfy]
PublisherId = "looneth"
DisplayName = "Prompto"
Icon = "https://raw.githubusercontent.com/EY4O/ComfyUI-Prompto/main/docs/images/icon.png"
