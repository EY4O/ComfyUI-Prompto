name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'EY4O' }}
    env:
      HAS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN != '' }}
    steps:
      - name: Registry token missing
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "::notice::Add a REGISTRY_ACCESS_TOKEN repository secret (registry.comfy.org publisher API key) to publish."
      - name: Check out code
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A version bump that only touches docs (README, docs/, LICENSE, workflows)
      # isn't published. Running the workflow by hand always publishes.
      - name: Skip docs-only changes
        id: changes
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: bash .github/scripts/needs-publish.sh "$EVENT" "$BEFORE" "$GITHUB_SHA"
      - name: Publish Custom Node
        if: ${{ env.HAS_TOKEN == 'true' && steps.changes.outputs.publish == 'true' }}
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
